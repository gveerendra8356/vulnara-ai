name: vulnara_mobile
description: Vulnara mobile companion app -- scan trigger, live status, critical push alerts, remediation approve/reject.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (Riverpod, as specified)
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Push notifications
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2

  # Routing
  go_router: ^14.1.4

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#131313"
  image: "assets/logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

  # Bundled locally (see assets/fonts/README.md) instead of the previous
  # google_fonts runtime-HTTP-fetch approach -- fetching over the network
  # on every cold start was the root cause of the near-100% Appium/
  # UiAutomator2 failure rate in CI: android-tests/conftest.py's driver
  # fixture uses noReset: False and the login_as_* fixtures additionally
  # `pm clear` + force-stop the app, so every single test was a genuine
  # first-ever-launch from google_fonts' point of view (its on-device
  # cache never survived between tests). Each screen's Text widgets then
  # rendered with a fallback font and rebuilt again whenever a fetch
  # landed (or timed out), which kept the window continuously "dirty"
  # for long enough that UiAutomator2's hardcoded, non-configurable 10s
  # root-AccessibilityNodeInfo-dump timeout
  # (appium-uiautomator2-server's AXWindowHelpers.AX_ROOT_RETRIEVAL_TIMEOUT)
  # was blown on nearly every single element lookup -- even though the
  # screen was, per the failure screenshots, already fully and correctly
  # rendered. Bundling removes the network dependency entirely, for CI
  # and for real users on a slow connection alike.
  #
  # Outfit and Inter and JetBrains Mono are shipped upstream as single
  # variable-weight files; declaring the same file under multiple
  # `weight:` entries is the standard Flutter pattern for pinning
  # specific static instances out of a variable font.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
          weight: 400
        - asset: assets/fonts/Outfit.ttf
          weight: 600
        - asset: assets/fonts/Outfit.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 700
