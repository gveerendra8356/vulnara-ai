name: vulnara_mobile
description: Vulnara mobile companion app -- scan trigger, live status, critical push alerts, remediation approve/reject.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (Riverpod, as specified)
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Push notifications
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2

  # Routing
  go_router: ^14.1.4

  intl: ^0.19.0

  # Fonts matching the Vulnara design system (Outfit / Inter / JetBrains Mono)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#131313"
  image: "assets/logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
