name: CI/CD Pipeline (Test → Bundle → Deploy)

# Unified pipeline matching the required architecture:
#
#   PUSH TO MAIN
#     ├── Selenium Web Tests ─┐
#     ├── Appium Mobile Tests ┤  (run in parallel)
#     ├── Load Tests ─────────┤
#     └── DAST Security Tests ┘
#                 ↓  (all four must PASS)
#           Bundle Reports
#                 ↓
#           Deploy Web → GitHub Pages
#
# Selenium + Appium reuse the existing mature sharded workflows via
# `workflow_call`. Load (Locust) and DAST (OWASP ZAP) run inline here against a
# backend/web instance started on the runner — never a third-party system.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write     # deploy job pushes to the gh-pages branch
  actions: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────── parallel test jobs ──────────────────────
  selenium-tests:
    name: Selenium Web Tests
    uses: ./.github/workflows/selenium-tests.yml

  appium-tests:
    name: Appium Mobile Tests
    uses: ./.github/workflows/android-tests.yml

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            load-tests/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install load-test dependencies
        run: pip install -r load-tests/requirements.txt

      - name: Seed DB and start the backend (background)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_load.db"
          VULNARA_SECRET_KEY: "ci-load-test-secret"
        run: |
          python seed_db.py || echo "seed step reported a non-zero exit (continuing — tables are created on startup too)"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../load-tests/backend.log 2>&1 &
          echo "Waiting for backend /health ..."
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && { echo "backend up"; break; }
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || { echo "backend did not become healthy"; tail -50 ../load-tests/backend.log; exit 1; }

      - name: Generate load test-case catalog
        working-directory: load-tests
        run: python test_cases/generate_catalog.py

      - name: Run Locust (headless)
        working-directory: load-tests
        env:
          LOAD_BASE_URL: "http://127.0.0.1:8000"
          LOAD_USERS: "25"
          LOAD_SPAWN_RATE: "5"
          LOAD_RUN_TIME: "90s"
        run: |
          mkdir -p reports
          locust -f locustfile.py --headless \
            -u "$LOAD_USERS" -r "$LOAD_SPAWN_RATE" -t "$LOAD_RUN_TIME" \
            --host "$LOAD_BASE_URL" \
            --csv reports/load --csv-full-history --only-summary

      - name: Generate load report + enforce performance gate
        working-directory: load-tests
        env:
          LOAD_BASE_URL: "http://127.0.0.1:8000"
        run: python reports/generate_report.py --stats reports/load_stats.csv --commit "${{ github.sha }}"

      - name: Job summary
        if: always()
        run: cat load-tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnara-load-report
          path: |
            load-tests/reports/load_report.xlsx
            load-tests/reports/load_report.json
            load-tests/reports/summary.md
            load-tests/reports/load_stats*.csv
            load-tests/test_cases/load_test_cases.json
            load-tests/test_cases/load_test_cases.csv
          retention-days: 30
          if-no-files-found: warn

  dast-security-tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vulnara-web/package-lock.json

      - name: Build the web app (Mock Mode) for scanning
        working-directory: vulnara-web
        run: |
          npm ci || npm install
          VITE_USE_MOCK=true npm run build

      - name: Lay out + serve the built app with security headers
        working-directory: vulnara-web
        run: |
          mkdir -p site/vulnara-ai
          cp -r dist/. site/vulnara-ai/
          cat > site/serve.json << 'EOF'
          {
            "rewrites": [
              { "source": "/vulnara-ai/**", "destination": "/vulnara-ai/index.html" }
            ],
            "headers": [
              { "source": "**", "headers": [
                { "key": "X-Content-Type-Options", "value": "nosniff" },
                { "key": "X-Frame-Options", "value": "DENY" },
                { "key": "Referrer-Policy", "value": "no-referrer" },
                { "key": "Permissions-Policy", "value": "geolocation=(), microphone=(), camera=()" },
                { "key": "Content-Security-Policy", "value": "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" }
              ]}
            ]
          }
          EOF
          npm install -g serve@14
          npx serve site -l 4173 --no-clipboard &
          echo "Waiting for the preview server ..."
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/vulnara-ai/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/vulnara-ai/ > /dev/null || { echo "preview server never came up"; exit 1; }

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://127.0.0.1:4173/vulnara-ai/"
          # Do NOT fail the step on warnings and do NOT open GitHub issues --
          # our own report generator applies the real High-risk gate below.
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

      - name: Generate DAST report + enforce security gate
        if: always()
        run: |
          python -m pip install --upgrade pip openpyxl
          mkdir -p dast/reports
          # The action writes report_json.json to the workspace root.
          if [ -f report_json.json ]; then cp report_json.json dast/reports/zap_report.json; fi
          python dast/test_cases/generate_catalog.py
          python dast/reports/generate_report.py --zap dast/reports/zap_report.json --commit "${{ github.sha }}" --target "http://127.0.0.1:4173/vulnara-ai/"

      - name: Job summary
        if: always()
        run: cat dast/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnara-dast-report
          path: |
            dast/reports/dast_report.xlsx
            dast/reports/dast_report.json
            dast/reports/summary.md
            dast/reports/zap_report.json
            dast/test_cases/dast_test_cases.json
            dast/test_cases/dast_test_cases.csv
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────── bundle reports ──────────────────────────
  bundle-reports:
    name: Bundle Reports
    needs: [selenium-tests, appium-tests, load-tests, dast-security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report deps
        run: pip install openpyxl

      - name: Download Selenium report
        uses: actions/download-artifact@v4
        with:
          name: vulnara-selenium-report
          path: reports/selenium
        continue-on-error: true

      - name: Download Appium report
        uses: actions/download-artifact@v4
        with:
          name: vulnara-android-report
          path: reports/appium
        continue-on-error: true

      - name: Download Load report
        uses: actions/download-artifact@v4
        with:
          name: vulnara-load-report
          path: reports/load-testing
        continue-on-error: true

      - name: Download DAST report
        uses: actions/download-artifact@v4
        with:
          name: vulnara-dast-report
          path: reports/dast-security
        continue-on-error: true

      - name: Build FINAL_TEST_SUMMARY
        run: python ci/bundle_summary.py --reports-dir reports --commit "${{ github.sha }}" --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Upload bundled reports
        uses: actions/upload-artifact@v4
        with:
          name: vulnara-final-reports
          path: reports
          retention-days: 90

  # ───────────────────────────── deploy web only ─────────────────────────
  deploy:
    name: Deploy Web (GitHub Pages)
    needs: [bundle-reports]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vulnara-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vulnara-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        # Reads vulnara-web/.env.production (real backend, VITE_USE_MOCK=false).
        run: npm run build

      - name: Deploy ONLY the web app to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vulnara-web/dist
          publish_branch: gh-pages
