name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "vulnara-web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vulnara-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vulnara-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Vite automatically reads vulnara-web/.env.production at build time.
        # VITE_API_BASE_URL and VITE_WS_BASE_URL are already set there.
        # VITE_USE_MOCK=false is also set there, disabling mock mode.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vulnara-web/dist
          publish_branch: gh-pages
