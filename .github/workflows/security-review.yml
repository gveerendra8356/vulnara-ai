name: Security Review (SAST + Dependencies)

# Phase 1-7 security assessment. Runs standard open-source scanners against the
# repository and aggregates their REAL output into reports. The individual
# scanners never fail the job (they run in detection mode); the single quality
# gate is security/generate_report.py, which fails the job ONLY on a Critical
# finding — matching the brief.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-review:
    name: SAST + dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: "Vulnerability Test Results"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install report + scanner tooling
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl semgrep==1.90.0 pip-audit==2.7.3

      # ── Phase 1-2: backend + API inventory ──────────────────────────────
      - name: Generate backend + endpoint inventory
        run: python security/endpoint_inventory.py --routes backend/app/api/routes --out "$OUT"

      # ── Phase 3: SAST (Semgrep) ─────────────────────────────────────────
      - name: Semgrep (SAST)
        continue-on-error: true
        run: |
          semgrep scan --config p/security-audit --config p/owasp-top-ten \
            --json --output semgrep.json --timeout 120 . || true

      # ── Phase 3: secret scanning (Gitleaks) ─────────────────────────────
      - name: Gitleaks (secret scan)
        continue-on-error: true
        run: |
          V=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --no-git --report-format json --report-path gitleaks.json --exit-code 0 || true

      # ── Phase 5: dependency scan (Trivy filesystem, CLI) ────────────────
      - name: Trivy (dependency / filesystem scan)
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.56.2/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v0.56.2
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln --format json --output trivy.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 . || true

      # ── Phase 5: Python deps (pip-audit) ────────────────────────────────
      - name: pip-audit (Python dependencies)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt -f json -o pip-audit.json || true

      # ── Phase 5: web deps (npm audit) ───────────────────────────────────
      - name: npm audit (web dependencies)
        continue-on-error: true
        working-directory: vulnara-web
        run: |
          npm ci || npm install
          npm audit --json > ../npm-audit.json || true

      # ── Phase 6-7: aggregate + gate (fails ONLY on Critical) ────────────
      - name: Aggregate findings + enforce Critical gate
        id: gate
        run: |
          python security/generate_report.py --out "$OUT" \
            --semgrep semgrep.json --gitleaks gitleaks.json --trivy trivy.json \
            --pip-audit pip-audit.json --npm-audit npm-audit.json \
            --commit "${{ github.sha }}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "# Security Review"
            echo ""
            cat "$OUT/executive-summary.md" 2>/dev/null || echo "_No executive summary produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnara-security-review
          path: |
            Vulnerability Test Results/**
            semgrep.json
            gitleaks.json
            trivy.json
            pip-audit.json
            npm-audit.json
          retention-days: 30
          if-no-files-found: warn
