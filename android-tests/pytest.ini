[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --reruns 2 --reruns-delay 3 --tb=short
markers =
    authentication: login/logout/session-start flows
    authorization: role-based access control (admin/analyst/client)
    navigation: bottom nav + deep-link routing
    forms: form field entry and control interaction
    crud_operations: scan creation and lifecycle
    remediation: remediation approve/reject/execute workflow
    input_validation: field boundary/edge-case input
    error_handling: backend-down / network-loss recovery
    session_management: token persistence, logout, cold start
    accessibility: content-description / semantics coverage
    responsive: orientation and layout checks
