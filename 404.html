<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vulnara</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect shim.
      // When GitHub Pages serves a 404 for a deep link like /scans/123,
      // it loads this page. We re-encode the URL into a query param and
      // redirect to the root index.html, which then reads the param and
      // replaces the history state so React Router sees the correct path.
      var pathSegmentsToKeep = 1; // number of segments in the repo base path (1 for /vulnara-ai/)

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
