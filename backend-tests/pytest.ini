[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    authentication: Authentication test cases
    authorization: Authorization / access-control test cases
    input_validation: Input validation / boundary test cases
    injection: Injection (SQLi/NoSQLi/Command/Path Traversal/SSRF) test cases
    business_logic: Business-logic test cases
    configuration: Configuration & security-header test cases
    functional_api: Functional CRUD / API-contract test cases
    dast: Dynamic security tests (auth bypass, IDOR, JWT tampering, rate limiting)
addopts = -ra --strict-markers
filterwarnings =
    ignore:The event loop scope for asynchronous fixtures will default to the "fixture" caching scope.*:pytest.PytestDeprecationWarning
    ignore:_pytest\.python\.CallSpec2 has been renamed to CallSpec.*:pytest.PytestRemovedIn10Warning
