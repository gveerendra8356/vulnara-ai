[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: fast critical-path checks
    authentication: login/register/logout flows
    authorization: RBAC and route-protection checks
    navigation: sidebar/nav behavior
    ui_validation: page chrome / rendering checks
    forms: form field behavior
    crud: create/read/update flows against Mock Mode state
    input_validation: boundary and malformed-input handling
    error_handling: error banners, 404s, recovery paths
    session_management: token/refresh/logout persistence
    search_filter: list search and status filter behavior
    accessibility: labels, alt text, heading structure, keyboard nav
    responsive: viewport-driven layout checks
